name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Prepare a private draft of the tested evaluation installer'
        type: boolean
        default: false
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[test,build]"
      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 compiler unavailable" }
      - name: Build and smoke-test
        shell: pwsh
        env:
          EMAILCHRONICLE_SIGNING_THUMBPRINT: ${{ vars.EMAILCHRONICLE_SIGNING_THUMBPRINT }}
          EMAILCHRONICLE_PUBLISHER: ${{ vars.EMAILCHRONICLE_PUBLISHER }}
        run: ./scripts/build-windows.ps1 -RequireSigning:($env:GITHUB_REF_TYPE -eq 'tag')
      - name: Test installation and uninstallation on isolated runner
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "EmailChronicle-InstallTest"
          $installer = (Get-ChildItem installer-output/*.exe).FullName
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installation failed" }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            foreach ($binary in Get-ChildItem $installDir -Recurse -File | Where-Object Extension -In '.exe','.dll','.pyd') {
              if ((Get-AuthenticodeSignature -LiteralPath $binary.FullName).Status -ne 'Valid') { throw "Installed binary signature invalid: $($binary.Name)" }
            }
          }
          $report = Join-Path $env:RUNNER_TEMP "installed-smoke.json"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process "$installDir\EmailChronicle.exe" -ArgumentList @('--smoke-test', "`"$report`"") -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "Installed smoke test timed out" }
          if ($app.ExitCode -ne 0 -or -not (Test-Path $report)) { throw "Installed executable failed" }
          $installedSmoke = Get-Content $report -Raw | ConvertFrom-Json
          if ($installedSmoke.status -ne 'ok' -or -not $installedSmoke.eml -or -not $installedSmoke.msg -or -not $installedSmoke.mixed_email_import) { throw 'Installed EML/MSG smoke report invalid' }
          $dataDir = Join-Path $env:LOCALAPPDATA "EmailChronicle"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $sentinel = Join-Path $dataDir "uninstall-preservation-test.txt"
          'retain investigation data' | Set-Content $sentinel
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstallation failed" }
          if (-not (Test-Path $sentinel)) { throw "Uninstall removed investigation data" }
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private
        with:
          name: EmailChronicle-Windows-installer
          path: installer-output/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = & .\.venv\Scripts\python.exe -c "import importlib.metadata; print(importlib.metadata.version('emailchronicle'))"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version differ" }
          $status = Get-Content installer-output/signing-status.json -Raw | ConvertFrom-Json
          if (-not $status.signed) { throw 'Unsigned releases are blocked' }
          $assets = (Get-ChildItem installer-output -File).FullName
          gh release create $env:GITHUB_REF_NAME @assets --draft --latest=false --verify-tag --title "EmailChronicle $version" --notes "Windows x64 installer. Signed and timestamped Windows binaries; Python is bundled. EML and Outlook MSG preview. The installer includes third-party sources and notices. Evidence is retained when uninstalling. SHA256SUMS.txt contains download checksums."
      - name: Publish explicitly requested evaluation preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = & .\.venv\Scripts\python.exe -c "import importlib.metadata; print(importlib.metadata.version('emailchronicle'))"
          $notes = "docs/RELEASE-NOTES-$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Version-specific preview notes missing' }
          $smoke = Get-Content installer-output/packaged-smoke-report.json -Raw | ConvertFrom-Json
          if ($smoke.status -ne 'ok' -or -not $smoke.msg -or -not $smoke.mixed_email_import) { throw 'Verified packaged smoke report required' }
          $distribution = Get-Content packaging/distribution-status.json -Raw | ConvertFrom-Json
          if ($distribution.application_license -eq 'pending-owner-decision') { throw 'Application licence selection required' }
          Compress-Archive -Path integrations/wordpress/plugins/emailchronicle-access -DestinationPath installer-output/emailchronicle-access.zip
          Copy-Item -LiteralPath $notes -Destination installer-output/RELEASE-NOTES.md
          Get-ChildItem installer-output -File | Where-Object Name -NE 'SHA256SUMS.txt' | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii installer-output/SHA256SUMS.txt
          $assets = (Get-ChildItem installer-output -File).FullName
          gh release create "v$version" @assets --target $env:GITHUB_SHA --draft --prerelease --latest=false --title "EmailChronicle $version — evaluation preview" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Preview publication failed' }
