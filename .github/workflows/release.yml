name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[test,build]"
      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 compiler unavailable" }
      - name: Build and smoke-test
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test installation and uninstallation on isolated runner
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "EmailChronicle-InstallTest"
          $installer = (Get-ChildItem installer-output/*.exe).FullName
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installation failed" }
          $report = Join-Path $env:RUNNER_TEMP "installed-smoke.json"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process "$installDir\EmailChronicle.exe" -ArgumentList @('--smoke-test', "`"$report`"") -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "Installed smoke test timed out" }
          if ($app.ExitCode -ne 0 -or -not (Test-Path $report)) { throw "Installed executable failed" }
          if ((Get-Content $report -Raw | ConvertFrom-Json).status -ne 'ok') { throw "Installed smoke report invalid" }
          $dataDir = Join-Path $env:LOCALAPPDATA "EmailChronicle"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $sentinel = Join-Path $dataDir "uninstall-preservation-test.txt"
          'retain investigation data' | Set-Content $sentinel
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstallation failed" }
          if (-not (Test-Path $sentinel)) { throw "Uninstall removed investigation data" }
      - uses: actions/upload-artifact@v4
        with:
          name: EmailChronicle-Windows-installer
          path: installer-output/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = & .\.venv\Scripts\python.exe -c "import importlib.metadata; print(importlib.metadata.version('emailchronicle'))"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version differ" }
          gh release create $env:GITHUB_REF_NAME installer-output/*.exe installer-output/SHA256SUMS.txt --verify-tag --title "EmailChronicle $version" --notes "Windows x64 installer. Download and run the Setup EXE; Python is bundled. First EML-only preview. Installer is unsigned. Evidence is retained when uninstalling. SHA256SUMS.txt contains the download checksum."
