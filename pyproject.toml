[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emailchronicle"
version = "0.1.0"
description = "Local forensic email chronology for Windows"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller==6.22.3", "PySide6==6.12.0"]

[project.scripts]
emailchronicle = "emailchronicle.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
